<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — NestKey</title>
  <meta name="theme-color" content="#0B1B2B">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="top"><div class="wrap">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/logo.png" alt="NestKey"><span class="brand-word">Nest<b>Key</b></span></a>
    <nav><a href="/browse.html">Browse</a><a href="/services.html">Services</a><span id="navauth"></span></nav>
  </div></header>

  <section class="section"><div class="wrap" style="max-width:460px" id="account">
    <div class="auth-tabs">
      <button data-tab="login" class="active">Sign in</button>
      <button data-tab="register">Create account</button>
    </div>

    <!-- Google sign-in -->
    <div id="google-area" style="margin:18px 0 6px">
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
           data-callback="onGoogleCredential"
           data-auto_select="false"
           data-itp_support="true"></div>
      <div class="g_id_signin"
           data-type="standard"
           data-theme="outline"
           data-size="large"
           data-text="continue_with"
           data-shape="pill"
           data-logo_alignment="left"
           style="display:flex;justify-content:center"></div>
      <div class="status" id="google-status"></div>
      <div style="text-align:center;color:#8aa0a8;margin:14px 0;font-size:.85rem">— or use your email —</div>
    </div>

    <form class="form" id="login-form">
      <h3 style="margin:0 0 14px">Welcome back</h3>
      <div class="field"><label>Email</label><input name="email" type="email" required></div>
      <div class="field"><label>Password</label><input name="password" type="password" required></div>
      <div class="status" id="login-status"></div>
      <button class="btn block" type="submit">Sign in</button>
    </form>

    <form class="form" id="register-form" style="display:none">
      <h3 style="margin:0 0 14px">Create your account</h3>
      <div class="field"><label>Name</label><input name="name" type="text" placeholder="Your name"></div>
      <div class="field"><label>I am a…</label>
        <select name="role"><option value="landlord">Landlord</option><option value="agent">Agent / Agency</option><option value="individual">Individual</option></select></div>
      <div class="field"><label>Company (optional)</label><input name="company" type="text"></div>
      <div class="field"><label>Phone</label><input name="phone" type="tel" placeholder="07xx xxx xxx"></div>
      <div class="field"><label>Email</label><input name="email" type="email" required></div>
      <div class="field"><label>Password</label><input name="password" type="password" required placeholder="At least 6 characters"></div>
      <div class="status" id="register-status"></div>
      <button class="btn block" type="submit">Create account</button>
    </form>
  </div></section>

  <footer class="foot"><div class="wrap">NestKey · <a href="/privacy.html">Privacy</a> · <a href="/cookies.html">Cookies</a></div></footer>

  <!-- Google credential handler (must be defined before the GSI callback fires) -->
  <script>
    window.onGoogleCredential = function (resp) {
      var s = document.getElementById('google-status');
      if (s) { s.className = 'status show info'; s.textContent = 'Signing you in…'; }
      fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: resp && resp.credential })
      }).then(function (r) { return r.json(); }).then(function (res) {
        if (!res || res.error) throw new Error(res && res.error ? res.error : 'Sign-in failed');
        try {
          localStorage.setItem('hh_token', res.token);
          localStorage.setItem('hh_user', JSON.stringify(res.user));
        } catch (e) {}
        location.href = (res.user && res.user.isAdmin) ? '/admin.html' : '/dashboard.html';
      }).catch(function (err) {
        if (s) { s.className = 'status show err'; s.textContent = err.message; }
      });
    };
  </script>
  <script src="/assets/config.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
