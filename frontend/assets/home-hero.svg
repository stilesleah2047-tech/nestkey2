<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2F33"/>
      <stop offset=".45" stop-color="#1A5653"/>
      <stop offset=".78" stop-color="#5E8F7D"/>
      <stop offset="1" stop-color="#C9B98A"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".78" r=".5">
      <stop offset="0" stop-color="#F6C77A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F6C77A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7A45"/>
      <stop offset="1" stop-color="#174A2C"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3A8"/>
      <stop offset=".6" stop-color="#F6B85C"/>
      <stop offset="1" stop-color="#D98B3A"/>
    </linearGradient>
    <linearGradient id="litDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9D597"/>
      <stop offset="1" stop-color="#C98642"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9ECE6"/>
      <stop offset="1" stop-color="#C9D0CB"/>
    </linearGradient>
    <linearGradient id="wallShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8C1BC"/>
      <stop offset="1" stop-color="#9DA8A3"/>
    </linearGradient>
    <radialGradient id="spill" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#FFD48A" stop-opacity=".6"/>
      <stop offset="1" stop-color="#FFD48A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="win" width="14" height="20" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="5" height="7" fill="#F7D48A" opacity=".55"/>
    </pattern>
    <pattern id="win2" width="18" height="16" patternUnits="userSpaceOnUse">
      <rect x="6" y="5" width="4" height="5" fill="#F7D48A" opacity=".4"/>
    </pattern>
    <pattern id="stone" width="40" height="28" patternUnits="userSpaceOnUse">
      <rect width="40" height="28" fill="#857B6E"/>
      <rect x="1" y="1" width="22" height="12" rx="2" fill="#A39785"/>
      <rect x="25" y="1" width="14" height="12" rx="2" fill="#968A79"/>
      <rect x="1" y="15" width="12" height="12" rx="2" fill="#9A8E7C"/>
      <rect x="15" y="15" width="24" height="12" rx="2" fill="#AEA290"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect width="1600" height="640" fill="url(#sky)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>
  <g fill="#fff" opacity=".5">
    <circle cx="120" cy="60" r="1.2"/><circle cx="340" cy="38" r="1"/><circle cx="560" cy="90" r="1.3"/>
    <circle cx="780" cy="44" r="1"/><circle cx="980" cy="70" r="1.2"/><circle cx="1240" cy="30" r="1"/>
    <circle cx="1420" cy="84" r="1.1"/><circle cx="250" cy="130" r=".9"/><circle cx="690" cy="150" r=".9"/>
  </g>

  <!-- distant hills -->
  <path d="M0 470 C 180 430 300 455 460 440 S 760 400 900 430 S 1200 390 1360 420 S 1520 410 1600 400 V640 H0Z" fill="#1E4A44" opacity=".75"/>

  <!-- Nairobi-style skyline -->
  <g fill="#123A3C">
    <rect x="30" y="360" width="60" height="200"/>
    <rect x="96" y="300" width="48" height="260"/>
    <rect x="150" y="330" width="70" height="230"/>
    <rect x="228" y="250" width="44" height="310"/>
    <rect x="278" y="340" width="56" height="220"/>
    <!-- KICC-style tower -->
