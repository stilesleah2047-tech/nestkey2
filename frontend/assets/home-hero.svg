  <g>
    <rect x="30" y="360" width="60" height="200" fill="url(#win2)"/>
    <rect x="96" y="300" width="48" height="260" fill="url(#win)"/>
    <rect x="150" y="330" width="70" height="230" fill="url(#win2)"/>
    <rect x="228" y="250" width="44" height="310" fill="url(#win)"/>
    <rect x="352" y="230" width="40" height="330" fill="url(#win)"/>
    <rect x="404" y="310" width="64" height="250" fill="url(#win2)"/>
    <rect x="476" y="270" width="38" height="290" fill="url(#win)"/>
    <rect x="520" y="350" width="80" height="210" fill="url(#win2)"/>
  </g>
  <rect x="371" y="146" width="2" height="4" fill="#FF6B5A"/>

  <!-- lawn -->
  <path d="M0 575 C 400 560 1000 540 1300 545 S 1500 538 1600 535 V640 H0Z" fill="url(#lawn)"/>
  <!-- near treeline -->
  <path d="M0 540 Q 40 500 80 530 Q 120 490 170 528 Q 220 496 260 532 Q 320 500 360 534 Q 420 506 470 536 Q 540 500 600 538 Q 660 510 720 540 Q 780 520 830 560 Q 780 600 600 620 Q 300 640 0 640Z" fill="#0F3A2E"/>

  <!-- acacia -->
  <g fill="#0B2E24">
    <path d="M868 560 C 872 520 864 490 852 470 L 858 468 C 870 486 878 506 880 528 C 884 500 900 480 920 468 L 924 474 C 904 488 890 512 884 560 Z"/>
    <path d="M770 470 C 790 446 840 438 880 444 C 920 436 980 440 1000 458 C 980 470 940 474 900 472 C 860 478 800 482 770 470 Z"/>
    <path d="M800 456 C 830 436 880 432 900 438 C 930 430 960 436 975 448 C 940 452 860 456 800 456Z" fill="#12392D"/>
  </g>


  <ellipse cx="1260" cy="572" rx="300" ry="40" fill="url(#spill)"/>

  <!-- HOUSE -->
  <!-- lower volume -->
  <rect x="1000" y="408" width="510" height="152" fill="url(#wall)"/>
  <rect x="1000" y="408" width="510" height="10" fill="#9AA5A0"/>
