    <ellipse cx="372" cy="220" rx="34" ry="9"/>
    <path d="M352 212 L372 172 L392 212Z"/>
    <rect x="370" y="150" width="4" height="26"/>
    <rect x="404" y="310" width="64" height="250"/>
    <rect x="476" y="270" width="38" height="290"/>
    <rect x="520" y="350" width="80" height="210"/>
    <rect x="606" y="380" width="50" height="180"/>
    <rect x="662" y="410" width="70" height="150"/>
