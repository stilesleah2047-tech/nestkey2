  <rect x="1258" y="426" width="182" height="124" fill="url(#lit)"/>
  <g stroke="#2B3532" stroke-width="4">
    <line x1="1053" y1="426" x2="1053" y2="550"/><line x1="1094" y1="426" x2="1094" y2="550"/><line x1="1135" y1="426" x2="1135" y2="550"/>
    <line x1="1303" y1="426" x2="1303" y2="550"/><line x1="1349" y1="426" x2="1349" y2="550"/><line x1="1395" y1="426" x2="1395" y2="550"/>
  </g>
  <rect x="1012" y="426" width="164" height="124" fill="none" stroke="#2B3532" stroke-width="5"/>
