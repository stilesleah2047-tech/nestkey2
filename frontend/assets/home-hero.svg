  <g fill="#17492F">
    <rect x="990" y="548" width="150" height="20" rx="10"/>
    <rect x="1280" y="548" width="240" height="20" rx="10"/>
  </g>
  <g fill="#1F5E3A">
    <circle cx="1004" cy="548" r="12"/><circle cx="1030" cy="545" r="13"/><circle cx="1060" cy="547" r="12"/>
    <circle cx="1090" cy="545" r="13"/><circle cx="1122" cy="548" r="12"/>
    <circle cx="1296" cy="547" r="12"/><circle cx="1330" cy="545" r="13"/><circle cx="1366" cy="548" r="12"/>
    <circle cx="1400" cy="545" r="13"/><circle cx="1436" cy="547" r="12"/><circle cx="1472" cy="545" r="13"/><circle cx="1506" cy="548" r="12"/>
  </g>
  <!-- garden lights -->
  <g fill="#FFE2A0">
    <circle cx="1150" cy="566" r="3"/><circle cx="1270" cy="566" r="3"/><circle cx="1180" cy="600" r="3"/><circle cx="1258" cy="600" r="3"/>
  </g>

  <!-- stepping path -->
  <g fill="#D9D3C4" opacity=".9">
    <path d="M1196 568 h44 l4 12 h-52z"/>
    <path d="M1188 590 h58 l5 14 h-68z"/>
    <path d="M1178 616 h76 l6 18 h-88z"/>
