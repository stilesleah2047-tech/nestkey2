  <!-- palm -->
  <g>
    <path d="M1560 640 C 1556 560 1546 470 1530 380 L 1540 378 C 1558 470 1568 560 1574 640Z" fill="#3B2F22"/>
    <g fill="#14402B">
      <path d="M1534 382 C 1490 360 1450 372 1420 400 C 1460 380 1500 380 1534 390Z"/>
      <path d="M1534 382 C 1500 330 1460 316 1424 320 C 1470 334 1504 356 1530 392Z"/>
      <path d="M1536 380 C 1540 330 1564 300 1600 290 C 1574 316 1556 344 1542 388Z"/>
      <path d="M1538 384 C 1580 370 1600 380 1620 400 L 1600 404 C 1580 392 1560 388 1540 390Z"/>
      <path d="M1534 384 C 1510 400 1494 430 1490 466 C 1504 434 1520 410 1540 392Z"/>
