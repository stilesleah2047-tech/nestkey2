  <rect x="1120" y="298" width="2" height="22" fill="#5A3F25"/><circle cx="1121" cy="324" r="6" fill="#FFF3D1"/>
  <rect x="1300" y="350" width="40" height="22" rx="4" fill="#A3683A" opacity=".55"/>

