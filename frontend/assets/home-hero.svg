  <rect x="1258" y="298" width="114" height="96" fill="url(#litDim)"/>
  <g stroke="#2B3532" stroke-width="4">
    <line x1="1103" y1="298" x2="1103" y2="394"/><line x1="1141" y1="298" x2="1141" y2="394"/>
    <line x1="1296" y1="298" x2="1296" y2="394"/><line x1="1334" y1="298" x2="1334" y2="394"/>
  </g>
  <rect x="1066" y="298" width="112" height="96" fill="none" stroke="#2B3532" stroke-width="5"/>
  <rect x="1258" y="298" width="114" height="96" fill="none" stroke="#2B3532" stroke-width="5"/>
