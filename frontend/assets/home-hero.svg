  <rect x="1026" y="506" width="18" height="34" rx="5" fill="#7A4A28" opacity=".6"/>
  <rect x="1280" y="508" width="70" height="8" fill="#6B4528" opacity=".55"/>
  <rect x="1286" y="516" width="4" height="28" fill="#6B4528" opacity=".55"/>
  <rect x="1340" y="516" width="4" height="28" fill="#6B4528" opacity=".55"/>
  <rect x="1360" y="440" width="2" height="30" fill="#5A3F25"/><circle cx="1361" cy="474" r="7" fill="#FFF3D1"/>
