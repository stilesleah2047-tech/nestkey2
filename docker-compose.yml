services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: househunt
    ports:
      - "5432:5432"
    volumes:
      - hh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:postgres@db:5432/househunt
      PORT: "4000"
      PUBLIC_URL: http://localhost:4000
      JWT_SECRET: dev-secret-change-me
      COMMISSION_RATE: "0.08"
      ROOM_RATE: "100"
      SHOWCASE_FEE: "500"
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  hh_pgdata:
